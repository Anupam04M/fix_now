$kind: http-request
description: |-
  ## Add Customer Address

  This endpoint allows users to add a new address for a customer. It is useful for managing customer address information within the system.

  ### Request

  **Method:** POST  
  **Endpoint:** `{{base_url}}/customer/addresses`

  #### Request Body

  The request body must be in JSON format and should include the following parameters:

  - **label** (string): A label for the address (e.g., "Home", "Office").
      
  - **contact_person** (string): The name of the person associated with the address.
      
  - **contact_phone** (string): The phone number of the contact person.
      
  - **address_line_1** (string): The primary address line (e.g., street address).
      
  - **address_line_2** (string): An additional address line (optional, e.g., apartment number).
      
  - **landmark** (string): A landmark near the address for easier identification.
      
  - **city** (string): The city where the address is located.
      
  - **state** (string): The state where the address is located.
      
  - **postal_code** (string): The postal code for the address.
      
  - **latitude** (number): The geographical latitude of the address.
      
  - **longitude** (number): The geographical longitude of the address.
      
  - **is_default** (boolean): Indicates if this address should be set as the default address.
      

  ### Response

  Upon successful creation of the address, the API will return a response with the following structure:

  - **status** (string): A message indicating the success of the operation (e.g., "Address added successfully").
      
  - **data** (object): Contains the details of the newly created address, including all the input parameters and any additional fields generated by the system (e.g., address ID).
      

  This endpoint is essential for maintaining accurate and up-to-date address information for customers, enabling better service delivery and communication.
url: "{{base_url}}/customer/addresses"
method: POST
headers:
  Authorization: Bearer {{customer_token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "label": "Home",
      "contact_person": "Priya Verma",
      "contact_phone": "9876500010",
      "address_line_1": "12 MG Road",
      "address_line_2": "Apartment 4B",
      "landmark": "Near Metro Station",
      "city": "Bengaluru",
      "state": "Karnataka",
      "postal_code": "560001",
      "latitude": 12.9716,
      "longitude": 77.5946,
      "is_default": true
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json?.data?.id) pm.collectionVariables.set('address_id', json.data.id);
    language: text/javascript
order: 2000
