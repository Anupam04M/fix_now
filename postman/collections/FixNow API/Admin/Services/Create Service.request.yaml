$kind: http-request
url: "{{base_url}}/admin/services"
method: POST
headers:
  Authorization: Bearer {{admin_token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "category_id": {{category_id}},
      "name": "Window Cleaning",
      "estimated_duration": 60,
      "base_price": 499,
      "status": "active"
    }
order: 2000
