$kind: http-request
url: "{{base_url}}/provider/profile"
method: POST
headers:
  Authorization: Bearer {{provider_token}}
body:
  type: formdata
  content:
    - type: text
      key: about
      value: Experienced provider
    - type: text
      key: experience_years
      value: "5"
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json?.data?.provider?.id) pm.collectionVariables.set('provider_profile_id', json.data.provider.id);
    language: text/javascript
order: 2000
