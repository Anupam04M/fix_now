$kind: http-request
url: "{{base_url}}/provider/availability"
method: POST
headers:
  Authorization: Bearer {{provider_token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "is_available": true,
      "available_from": "09:00",
      "available_until": "18:00",
      "notes": "Weekday schedule"
    }
order: 2000
