description: |-
  ### Get Categories

  This endpoint retrieves a list of categories available in the system. It is useful for clients that need to display or work with the various categories defined in the application.

  #### Request

  - **Method**: GET
      
  - **URL**: `{{base_url}}/categories`
      

  #### Response

  The response will return a JSON object containing an array of categories. Each category object typically includes the following structure:

  - **id**: A unique identifier for the category.
      
  - **name**: The name of the category.
      
  - **description**: A brief description of the category.
      

  #### Example Response

  ``` json
  {
      "categories": [
          {
              "id": "1",
              "name": "Electronics",
              "description": "Devices and gadgets."
          },
          {
              "id": "2",
              "name": "Books",
              "description": "Various genres of books."
          }
      ]
  }

   ```

  This endpoint does not require any input parameters and is designed to provide a comprehensive list of all available categories in the system.
url: "{{base_url}}/categories"
method: GET
